<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>The next billion developers won't be blocked by syntax. They'll be blocked by thinking.</title>

    <link rel="stylesheet" href="../dist/reveal.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../plugin/highlight/monokai.css" />
    <link rel="stylesheet" href="tedx-kth/style.css" />
  </head>

  <body class="tedx">
    <div class="reveal">
      <div class="slides">
        <section
          data-markdown="slides-markdown/tedx-kth.md"
          data-separator="^\n---\n$"
          data-separator-vertical="^\n--\n$"
        ></section>
      </div>
    </div>
    <script src="../dist/reveal.js"></script>
    <script src="../plugin/markdown/markdown.js"></script>
    <script src="../plugin/highlight/highlight.js"></script>
    <script src="../plugin/notes/notes.js"></script>
    <script src="../plugin/math/math.js"></script>

    <script>
      Reveal.initialize({
        controls: true,
        progress: true,
        history: true,
        center: true,

        plugins: [
          RevealMarkdown,
          RevealHighlight,
          RevealNotes,
          RevealMath.KaTeX,
        ],
      });
    </script>
  </body>
</html>
